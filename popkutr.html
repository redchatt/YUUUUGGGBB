<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameBazar - Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --bg-color: #080808;
            --primary-red: #e50914;
            --card-bg: #141414;
            --border-color: #222;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg-color); color: #fff; padding: 20px; display: flex; justify-content: center; }
        .admin-box { width: 100%; max-width: 600px; }
        h2 { color: var(--primary-red); text-align: center; margin-bottom: 20px; }
        .section { background: var(--card-bg); border: 1px solid var(--border-color); padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .section h3 { color: var(--primary-red); font-size: 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .input-group { margin-bottom: 10px; }
        .input-group input { width: 100%; padding: 10px; background: #222; border: 1px solid #333; color: #fff; border-radius: 6px; outline: none; }
        .btn { width: 100%; padding: 10px; background: var(--primary-red); color: #fff; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #222; font-size: 13px; }
    </style>
</head>
<body>

<div class="admin-box">
    <!-- Admin Login -->
    <div id="adminAuth" class="section">
        <h2>GAMEBAZAR ADMİN GİRİŞİ</h2>
        <form onsubmit="adminLogin(event)">
            <div class="input-group"><input type="text" id="admUser" placeholder="Login" required></div>
            <div class="input-group"><input type="password" id="admPass" placeholder="Şifrə" required></div>
            <button type="submit" class="btn">Daxil Ol</button>
        </form>
    </div>

    <!-- Admin Dashboard -->
    <div id="adminDashboard" style="display: none;">
        <h2>GAMEBAZAR İDARƏETMƏ PANELİ</h2>

        <!-- Depozit Kartı Əlavə Etmə -->
        <div class="section">
            <h3><i class="fa-solid fa-credit-card"></i> Depozit Kartı Əlavə Et</h3>
            <form onsubmit="addAdminCard(event)">
                <div class="input-group"><input type="text" id="bankName" placeholder="Bank / Sistem (məs: Kapital Bank)" required></div>
                <div class="input-group"><input type="text" id="cardNumber" placeholder="Kart Nömrəsi" required></div>
                <div class="input-group"><input type="text" id="cardHolder" placeholder="Ad Soyad (Kart Sahibi)" required></div>
                <button type="submit" class="btn">Kartı Yadda Saxla</button>
            </form>
            <div id="cardsList" style="margin-top: 15px;"></div>
        </div>

        <!-- Elan Təsdiqi -->
        <div class="section">
            <h3><i class="fa-solid fa-list-check"></i> Təsdiq Gözləyən Elanlar</h3>
            <div id="pendingAds"></div>
        </div>

        <!-- Depozit Sorğuları -->
        <div class="section">
            <h3><i class="fa-solid fa-money-bill-transfer"></i> Depozit Sorğuları</h3>
            <div id="depositReqs"></div>
        </div>

        <!-- İstifadəçilər & Mavi TİK -->
        <div class="section">
            <h3><i class="fa-solid fa-users"></i> İstifadəçilər & Mavi TİK</h3>
            <div id="usersList"></div>
        </div>

        <!-- Şifrə Bərpa Sorğuları -->
        <div class="section">
            <h3><i class="fa-solid fa-key"></i> Şifrə Bərpa Sorğuları</h3>
            <div id="passResets"></div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        databaseURL: "https://gamebazar-8fc97-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function adminLogin(e) {
        e.preventDefault();
        const u = document.getElementById('admUser').value.trim();
        const p = document.getElementById('admPass').value.trim();

        if (u === "GGHH321_QİJJ" && p === "AA33390_SBFVJH") {
            document.getElementById('adminAuth').style.display = 'none';
            document.getElementById('adminDashboard').style.display = 'block';
            loadDashboardData();
        } else {
            alert("Giriş məlumatları yanlışdır!");
        }
    }

    function addAdminCard(e) {
        e.preventDefault();
        const card = {
            id: Date.now(),
            bank: document.getElementById('bankName').value,
            number: document.getElementById('cardNumber').value,
            holder: document.getElementById('cardHolder').value
        };
        db.ref('admin_cards/' + card.id).set(card, () => {
            alert("Kart Uğurla Əlavə Olundu!");
            document.getElementById('bankName').value = '';
            document.getElementById('cardNumber').value = '';
            document.getElementById('cardHolder').value = '';
        });
    }

    function loadDashboardData() {
        // Admin Cards List
        db.ref('admin_cards').on('value', snap => {
            const container = document.getElementById('cardsList');
            container.innerHTML = '';
            snap.forEach(c => {
                const item = c.val();
                container.innerHTML += `
                    <div class="item">
                        <div><b>${item.bank}</b> - ${item.number} (${item.holder})</div>
                        <button onclick="deleteCard(${item.id})" style="background:red; color:#fff; border:none; padding:4px 8px; border-radius:4px;">Sil</button>
                    </div>
                `;
            });
        });

        // Pending Ads
        db.ref('ads').on('value', snap => {
            const container = document.getElementById('pendingAds');
            container.innerHTML = '';
            snap.forEach(c => {
                const ad = c.val();
                if (ad.status === 'PENDING') {
                    container.innerHTML += `
                        <div class="item">
                            <div><b>${ad.title}</b> (${ad.price} AZN) - @${ad.sellerUser}</div>
                            <button onclick="approveAd(${ad.id})" style="background:green; color:#fff; border:none; padding:4px 8px; border-radius:4px;">Təsdiqlə</button>
                        </div>
                    `;
                }
            });
        });

        // Users & Verified status
        db.ref('users').on('value', snap => {
            const container = document.getElementById('usersList');
            container.innerHTML = '';
            snap.forEach(c => {
                const u = c.val();
                container.innerHTML += `
                    <div class="item">
                        <div>@${u.username} (${u.phone}) - Balans: ${u.balance} AZN</div>
                        <button onclick="toggleVerify('${u.username}', ${!u.isVerified})" style="background:var(--primary-red); color:#fff; border:none; padding:4px 8px; border-radius:4px;">
                            ${u.isVerified ? 'Mavi Tik Sil' : 'Mavi Tik Ver'}
                        </button>
                    </div>
                `;
            });
        });

        // Pass Resets
        db.ref('pass_resets').on('value', snap => {
            const container = document.getElementById('passResets');
            container.innerHTML = '';
            snap.forEach(c => {
                const req = c.val();
                container.innerHTML += `<div class="item">Sorğu: ${req.userOrPhone} (${req.date})</div>`;
            });
        });
    }

    function deleteCard(id) {
        db.ref('admin_cards/' + id).remove();
    }

    function approveAd(id) {
        db.ref('ads/' + id).update({ status: 'APPROVED' });
    }

    function toggleVerify(username, status) {
        db.ref('users/' + username).update({ isVerified: status });
    }
</script>
</body>
</html>
