<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - İdarəetmə Sistemi</title>
  <style>
    :root {
      --bg-color: #0d0f12;
      --card-bg: #161b22;
      --accent-color: #ff2a2a;
      --text-color: #ffffff;
      --subtext: #8b949e;
      --border-color: #30363d;
      --green-color: #238636;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
    }

    .admin-container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    h2, h3 {
      margin-bottom: 15px;
    }

    .section-box {
      background: #0d0f12;
      border: 1px solid var(--border-color);
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: var(--subtext);
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      background: #161b22;
      border: 1px solid var(--border-color);
      color: white;
      border-radius: 6px;
      outline: none;
    }

    .btn {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn-green {
      background: var(--green-color);
    }

    .card-item, .receipt-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #161b22;
      padding: 12px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
    }

    .badge-active {
      background: rgba(35, 134, 54, 0.2);
      color: #3fb950;
      border: 1px solid #238636;
    }

    .btn-danger {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .receipt-img {
      max-width: 100px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <h2>⚙️ Admin İdarəetmə Paneli</h2>

    <!-- 1. DEPOZİT KARTLARININ İDARƏ EDİLMƏSİ -->
    <div class="section-box">
      <h3>💳 Depozit Kartlarını İdarə Et</h3>
      <p style="color: var(--subtext); font-size: 14px; margin-bottom: 15px;">Saytda depozit ödənişləri üçün görünəcək kartları eləvə edin və ya silin.</p>
      
      <div class="form-group">
        <label>Kart Nömrəsi / Bank Adı / Rekvizit:</label>
        <input type="text" id="card-input" placeholder="Məsələn: 4127 8888 9999 1234 (Kapital Bank)">
      </div>
      <button class="btn btn-green" onclick="addCard()">+ Kart Əlavə Et</button>

      <h4 style="margin-top: 20px;">Mövcud Kartlar:</h4>
      <div id="cards-list"></div>
    </div>

    <!-- 2. GƏLƏN ÖDƏNİŞ ÇEKLƏRİ -->
    <div class="section-box">
      <h3>📄 İstifadəçi Ödəniş Çekləri</h3>
      <p style="color: var(--subtext); font-size: 14px; margin-bottom: 15px;">İstifadəçilərin depozit edərkən yüklədiyi çeklər burada görünür.</p>
      
      <div id="receipts-list">
        <p style="color: var(--subtext);">Hələ ki, daxil olan ödəniş çeki yoxdur.</p>
      </div>
    </div>
  </div>

  <script>
    // Başlanğıc kart mətni
    let cards = [
      { id: 1, text: "4127 8888 9999 1234 (Kapital Bank)", active: true }
    ];

    // Nümunə çeklər siyahısı
    let receipts = [];

    // Kartlar siyahısını ekranda göstər
    function renderCards() {
      const list = document.getElementById('cards-list');
      list.innerHTML = '';

      if (cards.length === 0) {
        list.innerHTML = '<p style="color: var(--subtext); margin-top: 10px;">Aktiv kart yoxdur. Zəhmət olmasa kart əlavə edin.</p>';
        return;
      }

      cards.forEach((card, index) => {
        const item = document.createElement('div');
        item.className = 'card-item';
        item.innerHTML = `
          <div>
            <strong>💳 ${card.text}</strong>
            ${card.active ? '<span class="badge badge-active" style="margin-left: 8px;">Əsas Kart</span>' : ''}
          </div>
          <div>
            ${!card.active ? `<button class="btn" style="background:#30363d; margin-right:5px; font-size:12px;" onclick="setActiveCard(${index})">Əsas Et</button>` : ''}
            <button class="btn-danger" onclick="deleteCard(${index})">Sil</button>
          </div>
        `;
        list.appendChild(item);
      });
    }

    // Yeni Kart Əlavə Et
    function addCard() {
      const input = document.getElementById('card-input');
      const val = input.value.trim();

      if (val === '') {
        alert('Lütfən kart məlumatını daxil edin!');
        return;
      }

      const isFirst = cards.length === 0;
      cards.push({ id: Date.now(), text: val, active: isFirst });
      input.value = '';
      renderCards();
    }

    // Kartı Sil
    function deleteCard(index) {
      const wasActive = cards[index].active;
      cards.splice(index, 1);
      
      // Silinən kart əsas kart idisə, birincini əsas et
      if (wasActive && cards.length > 0) {
        cards[0].active = true;
      }
      renderCards();
    }

    // Seçilən kartı əsas depozit kartı et
    function setActiveCard(index) {
      cards.forEach(c => c.active = false);
      cards[index].active = true;
      renderCards();
    }

    // Çekləri göstər
    function renderReceipts() {
      const list = document.getElementById('receipts-list');
      if (receipts.length === 0) {
        list.innerHTML = '<p style="color: var(--subtext);">Hələ ki, daxil olan ödəniş çeki yoxdur.</p>';
        return;
      }

      list.innerHTML = '';
      receipts.forEach((r, i) => {
        const item = document.createElement('div');
        item.className = 'receipt-item';
        item.innerHTML = `
          <div>
            <p><strong>İstifadəçi:</strong> ${r.user}</p>
            <p><strong>Məbləğ:</strong> ${r.amount} AZN</p>
            <p style="color: var(--subtext); font-size:12px;">Saat: ${r.time}</p>
          </div>
          <div>
            <button class="btn btn-green" style="font-size:12px; margin-right:5px;" onclick="approveReceipt(${i})">Təsdiqlə</button>
            <button class="btn-danger" style="font-size:12px;" onclick="rejectReceipt(${i})">Rədd Et</button>
          </div>
        `;
        list.appendChild(item);
      });
    }

    function approveReceipt(index) {
      alert('Ödəniş təsdiqləndi və balans artırıldı!');
      receipts.splice(index, 1);
      renderReceipts();
    }

    function rejectReceipt(index) {
      alert('Ödəniş çeki rədd edildi.');
      receipts.splice(index, 1);
      renderReceipts();
    }

    // Səhifə yüklənəndə kartları göstər
    renderCards();
  </script>
</body>
</html>
